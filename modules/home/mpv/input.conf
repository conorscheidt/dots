# input.conf — laptop-optimized for 14" MacBook Pro, bespoke UI
#
# Seek keys use `no-osd` + osd-bar=no in mpv.conf: nothing flashes on seek.
# Short seeks are exact (dialog-replay precision); 10s jumps use keyframes
# (instant on 4K HEVC — exact seeks decode from the previous keyframe).

## Mouse
MBTN_LEFT_DBL    cycle fullscreen
MBTN_LEFT        ignore
MBTN_RIGHT       cycle pause                                                    # right-click = pause

## Media keys
PLAY             cycle pause
PAUSE            cycle pause
PLAYPAUSE        cycle pause

NEXT             playlist-next
PREV             playlist-prev
MUTE             osd-msg cycle mute
VOLUME_UP        osd-msg add volume 2
VOLUME_DOWN      osd-msg add volume -2

FORWARD          no-osd seek  10 relative+keyframes
REWIND           no-osd seek -10 relative+keyframes

CLOSE_WIN        quit

## Arrows
RIGHT            no-osd seek  3 relative+exact
LEFT             no-osd seek -3 relative+exact
UP               osd-msg add volume 2
DOWN             osd-msg add volume -2

## Laptop tilt seeks — Z / X mirror ← / → (machine tilted either way)
z                no-osd seek -5 relative+exact
x                no-osd seek  5 relative+exact
Z                no-osd seek -10 relative+keyframes
X                no-osd seek  10 relative+keyframes

## Numpad
KP9              playlist-next
KP7              playlist-prev
KP6              no-osd seek  5 relative+exact
KP4              no-osd seek -5 relative+exact
KP8              osd-msg add volume 2
KP2              osd-msg add volume -2
KP5              cycle fullscreen
KP_INS           cycle pause
KP_DEL           quit

## Keys
SPACE            cycle pause

b                playlist-next
n                playlist-next
p                playlist-prev
PGDWN            playlist-next
PGUP             playlist-prev

m                osd-msg cycle mute

BS               no-osd set speed 1.0; show-text "Speed: ${speed}×"
# Fine speed steps. Backspace resets the current title.
[                no-osd add speed -0.025; show-text "Speed: ${speed}×"
]                no-osd add speed 0.025; show-text "Speed: ${speed}×"

O                no-osd cycle-values osd-level 3 1

.                frame-step
,                frame-back-step

ESC              set fullscreen no
f                cycle fullscreen

Ctrl+h           script-binding select/select-watch-history                    #! Playback > Watch history

i                script-binding hud/toggle                                     #! Video > Stats + controls panel
I                script-binding stats/display-stats-toggle

g                ignore
g-c              script-binding console/enable

l                ab-loop

# Sync mode flip: audio = instant seeks / display-resample = interpolation-smooth
s                osd-msg cycle-values video-sync audio display-resample         #! Video > Toggle sync: seeks vs smoothness

# Compare the XDR output with mpv's SDR tone mapping.
h                script-binding zmenuflows/toggle-hdr                         #! Video > Toggle HDR output

## Tab switches Full and Eco.
TAB              script-binding prefs/cycle-preset

## Subtitle vertical position — raise off baked-in CJK subs (lower value = higher).
## HUD panel (i) shows the live sub-pos value.
Alt+UP           add sub-pos -2                                                #! Subtitles > Nudge up
Alt+DOWN         add sub-pos +2                                                #! Subtitles > Nudge down
Alt+0            set sub-pos 95                                                #! Subtitles > Position reset

## Menus (bespoke popups)
Ctrl+o           script-binding zmenuflows/browse                              #! File > Open (browser)
Ctrl+s           script-binding zmenuflows/loadsub                             #! Subtitles > Load from file
Ctrl+p           script-binding zmenuflows/playlist                            #! Playback > Playlist
c                script-binding zmenuflows/chapters                            #! Playback > Chapters
u                script-binding zmenuflows/download                            #! Subtitles > Download (OpenSubtitles)

## Subtitle / audio timing
-                osd-msg add sub-delay -0.05                                  #! Subtitles > Timing: subs earlier (-)
=                osd-msg add sub-delay +0.05                                   #! Subtitles > Timing: subs later (=
Ctrl+-           osd-msg add audio-delay -0.005
Ctrl+=           osd-msg add audio-delay +0.005

## What's-running info: preset, HDR pipeline, shaders
?                show-text "Preset: ${user-data/preset:full}\nHDR: ${video-params/gamma:unknown}  hint: ${target-colorspace-hint}  peak: ${hdr-compute-peak}\nShaders: ${glsl-shaders}\nSync: ${video-sync}  Speed: ${speed}" 5000 #! Video > Pipeline info

# Denoise toggle (height-gated: refuses on 4K where nlmeans causes drop storms)
# d                script-binding denoise/toggle                                  #! Video > Toggle denoise (nlmeans)

q                quit
Q                quit-watch-later

HOME             seek 0 absolute

# Image viewer keybinds
WHEEL_UP         {image} script-binding positioning/cursor-centric-zoom  0.1
WHEEL_DOWN       {image} script-binding positioning/cursor-centric-zoom -0.1
0                {image} no-osd set video-align-y 0; no-osd set video-align-x 0

# kill trackpad horizontal swipe-to-seek (unwanted). vertical WHEEL_UP/DOWN are
# consumed by menu.lua/hud.lua when open, else fall through to their defaults.
WHEEL_LEFT   ignore
WHEEL_RIGHT  ignore

CTRL+! no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
