# M4 / built-in XDR. VideoToolbox falls back to software for unsupported streams.
vo=gpu-next
gpu-context=macvk
hwdec=auto
profile=high-quality
cscale=ewa_lanczossharp
dscale=hermite
correct-downscaling=yes
sigmoid-upscaling=yes
scale-antiring=0.6
vulkan-async-compute=no
vulkan-async-transfer=no
swapchain-depth=3

# Film cadence on ProMotion. Eco trades interpolation for lower GPU load.
video-sync=display-resample
interpolation=yes
tscale=oversample
framedrop=vo

# SDR stays in the normal compositor color space. HDR is set per stream below.
target-colorspace-hint=auto
gamut-mapping-mode=perceptual
hdr-compute-peak=yes
dither-depth=auto

# AVFoundation can deliver multichannel audio to macOS Spatial Audio.
ao=avfoundation
audio-channels=auto-safe
audio-normalize-downmix=yes
audio-pitch-correction=yes

# Custom playback bar and native macOS window chrome.
osc=no
osd-bar=no
osd-level=1
osd-font="SF Pro Display"
fullscreen=yes
autofit=100%
force-window=immediate
cursor-autohide=1000
input-preprocess-wheel=no
macos-title-bar-appearance=vibrantDark
macos-title-bar-material=popover
macos-fs-animation-duration=0

sub-auto=fuzzy
sub-use-margins=no
sub-fix-timing=yes
sub-filter-sdh=yes
sub-font="SF Pro Display"
sub-font-size=38
sub-color="#FAF0E6"
sub-pos=95
sub-border-size=0.8
sub-blur=0.2

# Keep history and resume position. perseries.lua owns playback speed.
keep-open=yes
reset-on-next-file=audio-delay,mute,pause,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,volume
save-watch-history=yes
save-position-on-quit=yes
watch-later-options-remove=speed,osd-margin-y

[protocol.http]
hls-bitrate=max

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http

[hdr-xdr]
profile-desc=HDR swapchain on the XDR panel
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy-equal
# mpv 0.41's macvk backend needs an explicit hint to request PQ/HLG output.
target-colorspace-hint=yes

[sdr-upscale]
profile-desc=RAVU luma and CfL chroma for HD and smaller SDR sources
profile-cond=(width or 0) > 0 and width <= 1920 and (height or 0) > 0 and height <= 1080 and p["video-params/gamma"] ~= "pq" and p["video-params/gamma"] ~= "hlg" and p["user-data/preset"] ~= "eco" and p["user-data/upscale"] ~= "ewa"
profile-restore=copy-equal
glsl-shaders="~~/shaders/ravu-zoom-ar-r3.hook:~~/shaders/CfL_Prediction.glsl"

[eco]
profile-desc=Lower GPU load for battery and fast playback
profile-cond=p["user-data/preset"] == "eco"
profile-restore=copy
video-sync=audio
interpolation=no
scale=spline36
cscale=bilinear
