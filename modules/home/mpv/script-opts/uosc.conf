# uosc — THE UI (idiomatic, single codebase; zen.lua deleted). Native Material
# icon font, forked inset-pill selection (Menu.lua) + hover pills (Button.lua).
# Written wholesale — do NOT content-patch this file (has silently failed here).

# Timeline: slim, rounded, expands on hover with thumbfast preview + chapters
timeline_style=line
timeline_line_width=1
timeline_size=1
timeline_border=0
timeline_persistency=
progress=never
timeline_cache=yes

# Controls: curated minimal row (Material icons from uosc_icons.otf).
# menu | subs audio download browse | (spring) speed (spring) | preset | prev playlist next | fullscreen
controls=
controls_size=32
controls_margin=8
controls_spacing=3

top_bar=never
autohide=yes
pause_indicator=none

# subtitles download (zmenuflows.lua reads its API key from user.conf)
languages=slang,en
subtitles_directory=~~/subtitles

# menus: airy macOS density + forked inset pills
menu_item_height=44
menu_padding=8
menu_min_width=300

# style: near-black material, rounded, airy
color=foreground=ffffff,foreground_text=0a0a0c,background=1c1c1e,background_text=f5f5f7,curtain=000000
opacity=timeline=0,controls=0,curtain=0.45,menu=0.96,submenu=0.5
border_radius=10
font_scale=1.05
text_border=0.6
