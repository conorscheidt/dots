# thumbfast — seek-bar hover-preview thumbnails (used by the custom playback bar)
# https://github.com/po5/thumbfast
# Only keys that exist in thumbfast.lua are set here.

# Max thumbnail dimensions (px). thumbfast renders at this size; ModernZ sizes
# the preview box to fit. 200x200 is a good detail/cost balance.
max_width=200
max_height=200

# Start the worker on demand, avoiding a second decoder at playback start.
spawn_first=no

# no thumbnails for network/streamed sources (you watch local files; keeps it light)
network=no

# no thumbnails for audio-only files
audio=no

# keep hardware decoding OFF for the thumbnailer so it never contends with the
# main player's VideoToolbox decoder on 4K DV files (thumbnails decode in SW)
hwdec=no

# mpv_path stays at its default: nixpkgs' thumbfast wrapper puts mpv on PATH,
# so the thumbnailer also spawns when mpv is launched from Finder/Dock.
